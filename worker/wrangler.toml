# Deploy: npx wrangler deploy  (needs a Cloudflare API token with Workers Scripts:Edit [+ Workers KV Storage:Edit])
# Secrets: npx wrangler secret put FLEET_TOKEN ; npx wrangler secret put SUPERTEAM_KEY
name = "grokkius-fleet-watch"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[triggers]
crons = ["23 */3 * * *"]   # every 3 h at :23 (1 of 5 free cron triggers); same as cf-deploy.sh

# Uncomment after: npx wrangler kv namespace create FLEET_KV
# [[kv_namespaces]]
# binding = "FLEET_KV"
# id = "<namespace id>"

name: linkcheck
# Scheduled smoke test of this project's own published sites (CI-style use of Actions).
# Compact results are committed to main (results/), readable with one unauthenticated GET:
#   https://raw.githubusercontent.com/SirGrokkius/grokkius-fleet/main/results/latest.json
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 h at :17 UTC, off the top of the hour
  workflow_dispatch:
    inputs:
      max_links:
        description: "max unique off-page links to check"
        default: "300"
permissions:
  contents: write
concurrency:
  group: linkcheck
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Run linkcheck
        run: |
          python scripts/linkcheck.py --targets targets.json --out results/linkcheck.json \
            --prev results/linkcheck.json --max-links "${{ inputs.max_links || '300' }}"
      - name: Update index
        run: |
          python - <<'PY'
          import json, os
          d = json.load(open("results/linkcheck.json"))
          p = "results/latest.json"
          idx = json.load(open(p)) if os.path.exists(p) else {}
          idx["linkcheck"] = {"generated_utc": d["generated_utc"], "summary": d["summary"],
                              "broken": d["broken"][:20], "run": os.environ["GITHUB_RUN_ID"]}
          json.dump(idx, open(p, "w"), separators=(",", ":"))
          PY
      - name: Commit compact result
        run: |
          git config user.name "grokkius-fleet-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/linkcheck.json results/latest.json
          git diff --cached --quiet && exit 0
          git commit -m "results: linkcheck [skip ci]"
          git pull --rebase -q origin main && git push
